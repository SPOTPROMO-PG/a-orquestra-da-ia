<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>O livro em branco</title>
<meta name="claude:viewport-fit-sides">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
:root{
  --spot-red:#e3001b;
  --spot-red-deep:#c41029;
  --stage:#15161a;
  --stage-ink:#ffffff;
  --stage-muted:#b8b8bc;
  --ink:#333333;
  --text:#4a4a4a;
  --text-muted:#6e6e6e;
  --paper:#fbf7ee;
  --paper-edge:#e9e1cd;
  --line:#dedcdd;

  /* unidade fluida: 1u = 1px em 1920x1080 (livro aberto = 1080u de largura) */
  --u:max(0.2px, min(0.0667vw, 0.095vh));
  --pw:calc(540 * var(--u));
  --ph:calc(690 * var(--u));
  --rim:calc(5 * var(--u));
  --depth:calc(3 * var(--u));
  --ease-book:cubic-bezier(.55,.06,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --spot-red:#e3001b;--spot-red-deep:#c41029;--stage:#15161a;--stage-ink:#ffffff;--stage-muted:#b8b8bc;
    --ink:#333333;--text:#4a4a4a;--text-muted:#6e6e6e;--paper:#fbf7ee;--paper-edge:#e9e1cd;--line:#dedcdd;
  }
}
:root[data-theme="dark"]{
  --spot-red:#e3001b;--spot-red-deep:#c41029;--stage:#15161a;--stage-ink:#ffffff;--stage-muted:#b8b8bc;
  --ink:#333333;--text:#4a4a4a;--text-muted:#6e6e6e;--paper:#fbf7ee;--paper-edge:#e9e1cd;--line:#dedcdd;
}
@media (max-aspect-ratio: 1/1){
  :root{
    --u:max(0.2px, min(0.163vw, 0.069vh));
    --ph:calc(505 * var(--u));
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--stage)}
body{
  background:var(--stage);
  color:var(--stage-ink);
  font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}

/* ---------- palco ---------- */
.stage{
  position:fixed;inset:0;overflow:hidden;
  display:grid;grid-template-rows:auto 1fr auto;
  padding-left:max(16px, env(safe-area-inset-left));
  padding-right:max(16px, env(safe-area-inset-right));
  padding-top:max(0px, env(safe-area-inset-top));
  padding-bottom:max(0px, env(safe-area-inset-bottom));
  background:
    radial-gradient(ellipse 60% 55% at 50% 46%, rgba(255,255,255,.075), rgba(255,255,255,0) 70%),
    var(--stage);
  cursor:pointer;
}
.logo{
  position:absolute;top:clamp(14px,2.4vh,30px);left:max(16px, env(safe-area-inset-left), 2.2vw);
  width:clamp(104px,7.8vw,150px);height:auto;z-index:5;pointer-events:none;
}

/* texto do palco */
.head{
  position:relative;display:grid;place-items:center;
  min-height:17vh;
  padding:clamp(14px,3.2vh,40px) clamp(0px,11vw,240px) 0;
  text-align:center;z-index:4;
}
.t{
  grid-area:1/1;
  font-weight:800;letter-spacing:-.012em;line-height:1.16;
  font-size:clamp(22px, min(5.2vh, 3.4vw), 64px);
  max-width:20em;text-wrap:balance;
  opacity:0;transform:translateY(16px);filter:blur(4px);
  transition:opacity .6s ease, transform .7s var(--ease-book), filter .6s ease;
  pointer-events:none;
}
.t.on{opacity:1;transform:none;filter:none;transition-delay:.12s}
.t em{font-style:normal;color:var(--spot-red)}

/* ---------- cena 3D ---------- */
.scene{
  position:relative;perspective:2400px;perspective-origin:50% 38%;
  min-height:0;z-index:2;
}
.shadow{
  position:absolute;left:50%;top:calc(50% + var(--ph) * .5 + 26 * var(--u));
  width:calc(var(--pw) * 1.05);height:calc(54 * var(--u));
  transform:translateX(-50%);
  background:radial-gradient(ellipse at center, rgba(0,0,0,.6) 0%, rgba(0,0,0,.28) 45%, rgba(0,0,0,0) 72%);
  filter:blur(6px);
  transition:width 1.5s var(--ease-book), opacity .8s ease;
  animation:shadowbreath 6s ease-in-out infinite;
}
.stage.opened .shadow{width:calc(var(--pw) * 2.1)}
.stage.finale .shadow{opacity:0}
@keyframes shadowbreath{0%,100%{opacity:.95}50%{opacity:.7}}

.float,.tilt,.bookpos,.book,.cover{transform-style:preserve-3d}
.float{
  position:absolute;inset:0;
  --wob:3deg;
  animation:floaty 6s ease-in-out infinite;
  transition:opacity .9s ease;
}
.stage.opened .float{--wob:.6deg}
@keyframes floaty{
  0%,100%{transform:translateY(calc(-5 * var(--u))) rotateY(calc(var(--wob) * -1))}
  50%{transform:translateY(calc(7 * var(--u))) rotateY(var(--wob))}
}
.tilt{
  position:absolute;inset:0;
  transform:rotateX(9deg) rotateY(-27deg);
  transition:transform 1.6s var(--ease-book);
}
.stage.opened .tilt{transform:rotateX(12deg) rotateY(0deg)}
.stage.finale .float{opacity:0}

.bookpos{
  position:absolute;left:50%;top:50%;width:0;height:0;
  transform:translateX(calc(var(--pw) / -2));
  transition:transform 1.6s var(--ease-book);
}
.stage.opened .bookpos{transform:translateX(0)}

.book{
  position:absolute;left:0;top:calc(var(--ph) / -2);
  width:var(--pw);height:var(--ph);
}

/* camadas de papel / espessura */
.sheet{
  position:absolute;width:var(--pw);height:var(--ph);
  background:var(--paper);
  border:1px solid var(--paper-edge);
  border-radius:0 calc(7 * var(--u)) calc(7 * var(--u)) 0;
}
.lstack .sheet{left:calc(var(--pw) * -1);border-radius:calc(7 * var(--u)) 0 0 calc(7 * var(--u))}
.rstack .sheet{left:0}
.lstack{opacity:0;transition:opacity .5s ease 0s}
.stage.opened .lstack,.stage.opened .lboard{opacity:1;transition-delay:.35s}
.board{
  position:absolute;background:var(--spot-red-deep);
  top:calc(var(--rim) * -1);height:calc(var(--ph) + var(--rim) * 2);
  width:calc(var(--pw) + var(--rim));
  transform:translateZ(calc(var(--u) * -40));
}
.rboard{left:0;border-radius:0 calc(10 * var(--u)) calc(10 * var(--u)) 0;box-shadow:0 calc(10*var(--u)) calc(30*var(--u)) rgba(0,0,0,.35)}
.lboard{
  left:calc(var(--pw) * -1 - var(--rim));border-radius:calc(10 * var(--u)) 0 0 calc(10 * var(--u));
  opacity:0;transition:opacity .5s ease;
}
/* lombada: faixa no vinco */
.spine{
  position:absolute;left:calc(var(--u) * -9);top:calc(var(--rim) * -1);
  width:calc(var(--u) * 18);height:calc(var(--ph) + var(--rim) * 2);
  background:var(--spot-red-deep);
  transform:translateZ(calc(var(--u) * -40));
  opacity:0;transition:opacity .5s ease;
}
.stage.opened .spine{opacity:1;transition-delay:.35s}

/* páginas */
.page{
  position:absolute;
  width:var(--pw);height:var(--ph);
  background:var(--paper);
  display:flex;flex-direction:column;
  padding:calc(40 * var(--u)) calc(42 * var(--u)) calc(52 * var(--u));
  color:var(--ink);
}
.page.right{left:0;top:0;border-radius:0 calc(7 * var(--u)) calc(7 * var(--u)) 0}
.page.left{border-radius:calc(7 * var(--u)) 0 0 calc(7 * var(--u));position:relative;width:100%;height:100%}
.page::after{ /* sombra do vinco */
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
}
.page.right::after{background:linear-gradient(to right, rgba(60,40,10,.22), rgba(60,40,10,0) 11%)}
.page.left::after{background:linear-gradient(to left, rgba(60,40,10,.22), rgba(60,40,10,0) 11%)}
.pn{
  position:absolute;bottom:calc(18 * var(--u));
  font-family:'Caveat',cursive;font-weight:500;font-size:calc(24 * var(--u));color:var(--text-muted);
}
.page.right .pn{right:calc(40 * var(--u))}
.page.left .pn{left:calc(40 * var(--u))}

/* itens */
.item{
  flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;
  padding-top:calc(9 * var(--u));gap:calc(3 * var(--u));
  border-bottom:1px dashed var(--line);
}
.item:last-of-type{border-bottom-color:transparent}
.lab{
  perspective:calc(520 * var(--u));
  align-self:flex-start;
  opacity:0;transition:opacity .45s ease;
}
.item.on .lab{opacity:1}
.lab-in{
  display:grid;transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.3,1.25,.5,1);
  transition-delay:calc(var(--i) * 120ms);
}
.flipped .lab-in{transform:rotateX(180deg)}
.lab .a,.lab .b{
  grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  font-weight:800;font-size:calc(24 * var(--u));line-height:1.2;letter-spacing:-.005em;white-space:nowrap;
}
.lab .a{color:var(--text-muted)}
.lab .b{
  transform:rotateX(180deg);
  color:#fff;background:var(--spot-red);
  padding:calc(2 * var(--u)) calc(14 * var(--u)) calc(3 * var(--u));
  border-radius:calc(6 * var(--u));
  align-self:start;justify-self:start;
}
.val{
  font-family:'Caveat','Segoe Script',cursive;font-weight:700;
  font-size:calc(33 * var(--u));line-height:1.04;color:var(--ink);
  min-height:calc(36 * var(--u));text-wrap:balance;
}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0;white-space:pre}
.item.on .ch{opacity:1}
.item.write.on .ch{
  animation:ink .42s ease-out both;
  animation-delay:calc(var(--k) * var(--step, 34ms) + .25s);
}
@keyframes ink{
  0%{opacity:0;transform:translateY(calc(5 * var(--u))) scale(1.18);filter:blur(2.5px)}
  100%{opacity:1;transform:none;filter:none}
}

/* ---------- capa ---------- */
.cover{
  position:absolute;left:0;top:calc(var(--rim) * -1);
  width:calc(var(--pw) + var(--rim));height:calc(var(--ph) + var(--rim) * 2);
  transform-origin:0 50%;
  transform:translateZ(calc(var(--u) * 2)) rotateY(0deg);
  transition:transform 1.6s var(--ease-book);
}
.stage.opened .cover{transform:translateZ(calc(var(--u) * 2)) rotateY(-180deg)}
.cover .face{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.cover .front{
  background:linear-gradient(135deg, #e8051f 0%, var(--spot-red) 45%, var(--spot-red-deep) 100%);
  border-radius:0 calc(10 * var(--u)) calc(10 * var(--u)) 0;
  box-shadow:inset calc(10*var(--u)) 0 calc(14*var(--u)) rgba(0,0,0,.18), inset calc(-2*var(--u)) 0 0 rgba(255,255,255,.12);
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;
  padding:calc(78 * var(--u)) calc(56 * var(--u)) calc(64 * var(--u)) calc(70 * var(--u));
  color:#fff;overflow:hidden;
}
.cover .front::before{ /* friso do vinco */
  content:"";position:absolute;left:calc(26 * var(--u));top:0;bottom:0;width:calc(2 * var(--u));
  background:rgba(0,0,0,.22);box-shadow:calc(2*var(--u)) 0 0 rgba(255,255,255,.14);
}
.cover .front::after{ /* moldura */
  content:"";position:absolute;left:calc(46 * var(--u));right:calc(26 * var(--u));top:calc(34 * var(--u));bottom:calc(34 * var(--u));
  border:calc(2 * var(--u)) solid rgba(255,255,255,.4);border-radius:calc(4 * var(--u));pointer-events:none;
}
.cover .kicker{font-weight:700;font-size:calc(17 * var(--u));letter-spacing:.28em;text-transform:uppercase;opacity:.85}
.cover .ctitle{font-weight:900;font-size:calc(82 * var(--u));line-height:.98;letter-spacing:-.025em}
.cover .ctitle span{display:block;font-weight:800;font-size:.6em;letter-spacing:-.01em;margin-top:.12em}
.cover .cbar{width:calc(72 * var(--u));height:calc(7 * var(--u));background:#fff;border-radius:99px;opacity:.9}
.cover .back{
  transform:rotateY(180deg);
  background:var(--spot-red-deep);
  border-radius:calc(10 * var(--u)) 0 0 calc(10 * var(--u));
  padding:var(--rim) 0 var(--rim) var(--rim);
}

/* ---------- final ---------- */
.finale-text{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  padding:0 clamp(0px,6vw,160px);
  pointer-events:none;z-index:3;
}
.finale-text p{
  font-weight:800;letter-spacing:-.015em;line-height:1.2;
  font-size:clamp(26px, min(5.9vh, 4.3vw), 70px);
  max-width:22em;text-wrap:balance;
  opacity:0;transform:translateY(18px);filter:blur(5px);
  transition:opacity .8s ease, transform .9s var(--ease-book), filter .8s ease;
}
.finale-text .l2{display:block;margin-top:.35em}
.finale-text strong{
  color:var(--spot-red);font-weight:900;
  background:linear-gradient(var(--spot-red),var(--spot-red)) 0 100%/0 .09em no-repeat;
  padding-bottom:.08em;transition:background-size .9s var(--ease-book) 1.1s;
}
.stage.finale .finale-text p{opacity:1;transform:none;filter:none;transition-delay:.55s}
.stage.finale .finale-text strong{background-size:100% .09em}

/* ---------- rodapé ---------- */
.foot{
  position:relative;z-index:6;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px 22px;
  padding:0 0 clamp(14px,2.6vh,30px);
  cursor:default;
}
.dots{display:flex;align-items:center;gap:8px}
.dot{
  width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.2);
  transition:width .4s var(--ease-book), background .3s ease;
}
.dot.done{background:rgba(255,255,255,.55)}
.dot.cur{width:28px;background:var(--spot-red)}
.count{font-weight:700;font-size:15px;color:var(--stage-muted);min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
.btn{
  font:700 15px/1 'Montserrat',system-ui,sans-serif;color:var(--stage-muted);
  background:transparent;border:1px solid rgba(255,255,255,.26);border-radius:99px;
  padding:10px 20px;cursor:pointer;transition:background .2s ease,color .2s ease,border-color .2s ease,opacity .2s ease;
}
.btn:hover:not(:disabled){background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.5)}
.btn:focus-visible{outline:2px solid var(--spot-red);outline-offset:3px}
.btn:disabled{opacity:.3;cursor:default}
.btn.next{background:var(--spot-red);border-color:var(--spot-red);color:#fff}
.btn.next:hover:not(:disabled){background:var(--spot-red-deep);border-color:var(--spot-red-deep)}

/* ---------- retrato / celular ---------- */
@media (max-aspect-ratio: 1/1){
  .head{min-height:0;padding:calc(clamp(14px,2.4vh,30px) + 40px) 0 6px;height:clamp(110px,15vh,170px)}
  .t{font-size:clamp(21px,6vw,40px)}
  .logo{width:96px}
  .tilt{transform:rotateX(6deg) rotateY(-24deg)}
  .stage.opened .tilt{transform:rotateX(8deg) rotateY(0deg)}
  .bookpos{transform:translateY(calc(var(--ph) / -2))}
  .stage.opened .bookpos{transform:translateY(0)}
  .book{left:calc(var(--pw) / -2);top:0}
  .rboard{left:calc(var(--rim) * -1);top:0;width:calc(var(--pw) + var(--rim) * 2);height:calc(var(--ph) + var(--rim));border-radius:0 0 calc(10*var(--u)) calc(10*var(--u))}
  .lboard{left:calc(var(--rim) * -1);top:calc((var(--ph) + var(--rim)) * -1);width:calc(var(--pw) + var(--rim) * 2);height:calc(var(--ph) + var(--rim));border-radius:calc(10*var(--u)) calc(10*var(--u)) 0 0}
  .spine{display:none}
  .lstack .sheet{left:0;top:calc(var(--ph) * -1);border-radius:calc(7*var(--u)) calc(7*var(--u)) 0 0}
  .sheet,.rstack .sheet{border-radius:0 0 calc(7*var(--u)) calc(7*var(--u))}
  .page{padding:calc(14 * var(--u)) calc(34 * var(--u)) calc(18 * var(--u))}
  .page.right{border-radius:0 0 calc(7*var(--u)) calc(7*var(--u))}
  .page.left{border-radius:calc(7*var(--u)) calc(7*var(--u)) 0 0}
  .page.right::after{background:linear-gradient(to bottom, rgba(60,40,10,.2), rgba(60,40,10,0) 9%)}
  .page.left::after{background:linear-gradient(to top, rgba(60,40,10,.2), rgba(60,40,10,0) 9%)}
  .cover{left:calc(var(--rim) * -1);top:0;width:calc(var(--pw) + var(--rim) * 2);height:calc(var(--ph) + var(--rim));transform-origin:50% 0}
  .stage.opened .cover{transform:translateZ(calc(var(--u) * 2)) rotateX(180deg)}
  .cover .front{border-radius:0 0 calc(10*var(--u)) calc(10*var(--u));padding:calc(54 * var(--u)) calc(40 * var(--u))}
  .cover .front::before{display:none}
  .cover .front::after{left:calc(22 * var(--u));right:calc(22 * var(--u));top:calc(22 * var(--u));bottom:calc(22 * var(--u))}
  .cover .ctitle{font-size:calc(66 * var(--u))}
  .cover .cbar{width:calc(56 * var(--u))}
  .cover .back{transform:rotateX(180deg);border-radius:calc(10*var(--u)) calc(10*var(--u)) 0 0;padding:var(--rim) var(--rim) 0}
  .lab .a,.lab .b{font-size:calc(21 * var(--u))}
  .val{font-size:calc(29 * var(--u));min-height:0;line-height:1.02}
  .lab .b{padding:0 calc(10 * var(--u)) calc(1 * var(--u))}
  .item{gap:0;padding-top:calc(6 * var(--u))}
  .pn{display:none}
  .shadow{top:calc(50% + var(--ph) + 22 * var(--u));width:calc(var(--pw) * 1.0)}
  .stage.opened .shadow{width:calc(var(--pw) * 1.0)}
  .foot{gap:10px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .dots{order:-1;flex-basis:100%;justify-content:center;gap:6px}
  .dot{width:7px;height:7px}
  .dot.cur{width:22px}
  .count{order:0}
  .btn{padding:9px 16px;font-size:14px}
}

@media (prefers-reduced-motion: reduce){
  .float,.shadow{animation:none}
  .tilt,.bookpos,.cover,.t,.finale-text p,.lab-in,.lab,.dot,.lstack,.lboard,.spine,.finale-text strong,.float{transition-duration:.01s !important;transition-delay:0s !important}
  .item.write.on .ch{animation:none;opacity:1}
}
</style>

<div class="stage" id="stage" data-step="0">
  <img class="logo" src="../img/spot-logo-sobre-escuro.png" alt="SPOT">

  <div class="head" aria-live="polite">
    <h1 class="t on" data-g="0">Imagine que você é um livro em branco.</h1>
    <p class="t" data-g="1">Pense nas coisas que um livro tem.</p>
    <p class="t" data-g="2">E o que isso tem a ver com a IA?</p>
  </div>

  <div class="scene" id="scene">
    <div class="shadow"></div>
    <div class="float">
      <div class="tilt">
        <div class="bookpos">
          <div class="book" id="book">
            <div class="board rboard"></div>
            <div class="board lboard"></div>
            <div class="spine"></div>
            <div class="stack rstack" id="rstack"></div>
            <div class="stack lstack" id="lstack"></div>

            <div class="page right" id="pageR"><span class="pn">2</span></div>

            <div class="cover" id="cover">
              <div class="face front">
                <div class="kicker">SPOT PROMO</div>
                <div class="ctitle">Livro<span>em branco</span></div>
                <div class="cbar"></div>
              </div>
              <div class="face back">
                <div class="page left" id="pageL"><span class="pn">1</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="finale-text" aria-live="polite">
      <p>A IA sabe escrever qualquer livro.<span class="l2">O seu, <strong>só você</strong> sabe contar.</span></p>
    </div>
  </div>

  <div class="foot" id="foot">
    <button class="btn prev" id="prev" type="button" aria-label="Passo anterior">Anterior</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <span class="count" id="count" aria-live="off">0/13</span>
    <button class="btn next" id="next" type="button" aria-label="Próximo passo">Próximo</button>
  </div>
</div>

<script>
(function(){
  var ITEMS = [
    ['Título','Objetivo','Sexta-feira no BKO'],
    ['Autor','Seu papel','Analista de backoffice'],
    ['Gênero','Tipo de entrega','Manual prático'],
    ['Público','Quem vai ler','Coordenadores, com pressa'],
    ['Personagens','Dados e envolvidos','Promotores e pendências'],
    ['Cenário','Contexto','Operação P&G'],
    ['Enredo','Etapas','Listar, cobrar, conferir'],
    ['Regras do mundo','Regras e limites','Atrasada: prazo antes de hoje'],
    ['Final','Como saber que deu certo','Nenhuma pendência esquecida'],
    ['Capa','Formato e visual','Vermelho, amarelo e verde']
  ];
  var LAST = 13;
  var stage = document.getElementById('stage');
  var pageL = document.getElementById('pageL');
  var pageR = document.getElementById('pageR');

  /* camadas de papel (espessura do livro) */
  function stack(id, n){
    var el = document.getElementById(id), i, s;
    for(i = 0; i < n; i++){
      s = document.createElement('div');
      s.className = 'sheet';
      s.style.transform = 'translateZ(calc(var(--u) * ' + (-(i + 1) * 3) + '))';
      el.appendChild(s);
    }
  }
  stack('rstack', 12); stack('lstack', 12);

  /* itens */
  var itemEls = [];
  ITEMS.forEach(function(it, i){
    var el = document.createElement('div');
    el.className = 'item';
    el.style.setProperty('--i', i); el.setAttribute('data-i', i);
    var lab = document.createElement('div');
    lab.className = 'lab';
    lab.innerHTML = '<div class="lab-in"><span class="a"></span><span class="b"></span></div>';
    lab.querySelector('.a').textContent = it[0];
    lab.querySelector('.b').textContent = it[1];
    var val = document.createElement('div');
    val.className = 'val';
    var text = it[2], k = 0;
    el.style.setProperty('--step', Math.min(38, Math.round(1500 / text.length)) + 'ms');
    text.split(' ').forEach(function(word, wi, arr){
      var w = document.createElement('span');
      w.className = 'w';
      for(var c = 0; c < word.length; c++){
        var ch = document.createElement('span');
        ch.className = 'ch';
        ch.style.setProperty('--k', k++);
        ch.textContent = word[c];
        w.appendChild(ch);
      }
      val.appendChild(w);
      if(wi < arr.length - 1){ val.appendChild(document.createTextNode(' ')); k++; }
    });
    val.setAttribute('aria-label', text);
    el.appendChild(lab); el.appendChild(val);
    (i < 5 ? pageL : pageR).appendChild(el);
    itemEls.push(el);
  });

  /* pontinhos */
  var dotsEl = document.getElementById('dots'), dots = [];
  for(var d = 0; d <= LAST; d++){
    var dt = document.createElement('span'); dt.className = 'dot'; dotsEl.appendChild(dt); dots.push(dt);
  }
  var heads = Array.prototype.slice.call(document.querySelectorAll('.head .t'));
  var countEl = document.getElementById('count');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');

  var step = 0;

  function render(prev){
    stage.setAttribute('data-step', step);
    stage.classList.toggle('opened', step >= 1);
    stage.classList.toggle('flipped', step >= 12 && step < 13 || step >= 12);
    stage.classList.toggle('finale', step === 13);
    document.getElementById('book').classList.toggle('flipped', step >= 12);

    var g = step === 0 ? 0 : (step <= 11 ? 1 : (step === 12 ? 2 : -1));
    heads.forEach(function(h){ h.classList.toggle('on', +h.getAttribute('data-g') === g); });

    itemEls.forEach(function(el, i){
      var shouldOn = step >= i + 2;
      var isOn = el.classList.contains('on');
      if(shouldOn && !isOn){
        el.classList.remove('write');
        if(step === prev + 1 && step === i + 2){
          el.classList.add('write');
          void el.offsetWidth;
        }
        el.classList.add('on');
      } else if(!shouldOn && isOn){
        el.classList.remove('on'); el.classList.remove('write');
      }
    });

    dots.forEach(function(dt, i){
      dt.classList.toggle('cur', i === step);
      dt.classList.toggle('done', i < step);
    });
    countEl.textContent = step + '/' + LAST;
    prevBtn.disabled = step === 0;
    nextBtn.disabled = step === LAST;
  }

  function go(n){
    n = Math.max(0, Math.min(LAST, n));
    if(n === step) return;
    var p = step; step = n; render(p);
  }
  function next(){ go(step + 1); }
  function prev(){ go(step - 1); }
  function reset(){ var p = step; step = 0; render(p); }

  document.addEventListener('keydown', function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if(k === ' ' || k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === 'Enter'){
      e.preventDefault(); next();
    } else if(k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace'){
      e.preventDefault(); prev();
    } else if(k === 'r' || k === 'R'){
      e.preventDefault(); reset();
    }
  });
  document.addEventListener('keyup', function(e){ if(e.key === ' ' || e.key === 'Enter') e.preventDefault(); });

  prevBtn.addEventListener('click', function(e){ e.stopPropagation(); prev(); prevBtn.blur(); });
  nextBtn.addEventListener('click', function(e){ e.stopPropagation(); next(); nextBtn.blur(); });
  document.getElementById('foot').addEventListener('click', function(e){ e.stopPropagation(); });
  stage.addEventListener('click', function(){ next(); });

  render(0);
  window.__livro = { go: go, get step(){ return step; } };
})();
</script>

</body>
</html>
